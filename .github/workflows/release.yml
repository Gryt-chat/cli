name: Release CLI

# Dispatched by hand, same shape as the SFU release. Version comes from the
# tags rather than a committed file, so nothing is pushed to main and this
# works against a protected branch.
#
# goreleaser does the building and creates the GitHub release itself, so there
# is no separate action-gh-release step here: the archives, the checksums and
# the release notes all come out of `goreleaser release`. install.sh in the
# superproject reads those assets, so the archive naming in .goreleaser.yml is
# load-bearing — changing it breaks the one-line install.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      bump:
        description: "Version Bump Type (use custom to promote a beta to stable)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version, if "custom" is selected'
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: cli

jobs:
  release:
    name: Release CLI
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Git user
        shell: bash
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "beta" && "$CHANNEL" != "latest" ]]; then
            echo "Invalid channel: $CHANNEL"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          CHANNEL="${{ steps.channel.outputs.channel }}"
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          # This repository has no tags yet, so the first release has to name its
          # own version. Every release after that bumps from the newest tag.
          if [[ -z "$CURRENT_VERSION" ]]; then
            if [[ "$BUMP" != "custom" || -z "$CUSTOM_VERSION" ]]; then
              echo "No v* tags found, so there is nothing to bump from."
              echo "Dispatch the first release with bump=custom and an explicit version."
              exit 1
            fi
          else
            echo "Current version from tags: $CURRENT_VERSION"

            if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid current version: $CURRENT_VERSION"
              exit 1
            fi
          fi

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid custom version: $CUSTOM_VERSION"
              echo "Expected semver like 1.2.3 or 1.2.3-beta.1"
              exit 1
            fi

            NEW_VERSION="$CUSTOM_VERSION"
          else
            BASE_VERSION="${CURRENT_VERSION%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

            if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid current version: $CURRENT_VERSION"
              exit 1
            fi

            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *)
                echo "Invalid bump type: $BUMP"
                exit 1
                ;;
            esac
          fi

          # Until now the channel input was validated, written to an output and
          # read by nothing. goreleaser decides prerelease from the tag alone,
          # so dispatching with beta still shipped a stable release that
          # /releases/latest returned and the installer picked up. Both
          # install.sh and `gryt update` resolve /releases/latest, which
          # excludes prereleases, so the distinction has to come from here.
          if [[ "$CHANNEL" == "beta" ]]; then
            BASE="${NEW_VERSION%%-*}"
            NEXT=1
            while git rev-parse "v${BASE}-beta.${NEXT}" >/dev/null 2>&1 ||
              git ls-remote --exit-code --tags origin "refs/tags/v${BASE}-beta.${NEXT}" >/dev/null 2>&1; do
              NEXT=$((NEXT + 1))
            done
            NEW_VERSION="${BASE}-beta.${NEXT}"
            echo "Beta channel: releasing $NEW_VERSION"
          fi

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version did not change: $CURRENT_VERSION"
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists on origin."
            exit 1
          fi

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
